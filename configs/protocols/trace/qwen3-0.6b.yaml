# TRACE on qwen3-0.6b: 1 epoch per task, effective batch 64 (global forward 8 x accumulation 8), bf16
backbone: {name: qwen3-0.6b, path: "${CODELORA_MODELS}/Qwen3-0.6B"}
data: {prompt_style: plain, max_source_length: 1024, max_target_length: 256}
train: {lr: 1.0e-3, micro_batch_size: 8, grad_accum: 8, num_workers: 4}
eval: {batch_size: 16, embedding_batch_size: 16, matrix: diagonal_final, sort_by_length: true}
router: {kind: lda, threshold: 0.0, lda_samples: 1000, lda_shrinkage: 0.01, embedding_input: raw_source}
# Qwen3-0.6B: lr 1e-3 for the per-task-expert methods (De-LoRA, CoDe-LoRA: a new expert needs it to learn the 4-6 update
# tasks, at 1e-4 De-LoRA drops from 71.2 to 59.5 AP); 1e-4 for the methods that train one shared adapter (at 1e-3 they
# forget catastrophically, LoRA on Long: AP 10.5, BWT -62).
per_method:
  lora:
    train: {lr: 1.0e-4}
  c-lora:
    train: {lr: 1.0e-4}
  o-lora:
    train: {lr: 1.0e-4}
  n-lora:
    train: {lr: 1.0e-4}
  co-lora:
    train: {lr: 1.0e-4}
  mole-cie:
    train: {lr: 1.0e-4}
