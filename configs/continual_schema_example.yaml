# Example configuration schema for continual LoRA experiments
# This is an illustrative template; adapt fields to your runners.

method: shared-lora               # which algorithm/implementation to instantiate via ModelFactory
model_name: shared_lora           # key passed to the factory
run_root: runs                    # root directory for outputs (runs/<method>/<task_seq>/...)
task_sequence: order1             # name of the task ordering
seed: 42

model:
  model_name_or_path: initial_model/t5-large
  tokenizer_name: initial_model/t5-large
  peft:
    r: 8
    lora_alpha: 16
    lora_dropout: 0.05
    target_modules: [q_proj, v_proj]
  load_checkpoint: null           # optional warm-start checkpoint

train:
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 3.0e-4
  weight_decay: 0.01
  num_train_epochs: 3
  max_steps: null                 # set to override num_train_epochs
  logging_steps: 50
  save_strategy: epoch
  fp16: true
  gradient_checkpointing: true

# Data and tokenizer-related options
# The dataset builder can reuse existing uie_dataset_lora.py paths.
data:
  data_dir: CL_Benchmark
  task_config_dir: configs/base_tasks
  instruction_file: configs/instruction_config.json
  instruction_strategy: single
  max_source_length: 512
  max_target_length: 64
  max_num_instances_per_task: 10000
  max_num_instances_per_eval_task: 1000
  num_beams: 1
  repetition_penalty: 1.0

# Task list in the learning order; each task can override metrics and splits.
tasks:
  - name: yelp
    dataset_path: CL_Benchmark/SC/yelp
    train_split: train
    eval_split: validation
    metrics: [exact_match]
  - name: amazon
    dataset_path: CL_Benchmark/SC/amazon
    train_split: train
    eval_split: validation
    metrics: [exact_match]
  - name: MNLI
    dataset_path: CL_Benchmark/NLI/MNLI
    train_split: train
    eval_split: validation_matched
    metrics: [accuracy]

# Evaluation policy after each task
# strategy: learned | all | custom
# metrics_map lets you override defaults per task or set a fallback.
eval:
  strategy: learned
  custom_tasks: []
  metrics_map:
    default: [rouge]
    SC: [exact_match]
    MNLI: [accuracy]

# Filesystem layout helper to produce runs/<method>/<task_seq>/t{idx}-{task}/<timestamp>/
paths:
  run_root: runs
  artifacts_root: artifacts
